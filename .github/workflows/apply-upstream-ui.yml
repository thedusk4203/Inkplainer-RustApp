name: Apply upstream-style native UI

on:
  push:
    branches: [main]
    paths:
      - 'tools/restyle_upstream_ui.py'
      - '.github/workflows/apply-upstream-ui.yml'

permissions:
  contents: write

jobs:
  restyle:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply native UI restyle
        run: python tools/restyle_upstream_ui.py
      - name: Format
        run: cargo fmt --all
      - name: Check with warnings denied
        shell: pwsh
        run: |
          $env:RUSTFLAGS='-D warnings'
          cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Commit UI refactor
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/app.rs src/export_worker.rs src/render.rs
            git commit -m 'feat: match native UI to Inkplainer web layout'
            git push origin HEAD:main
          }
