name: Validate native UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
