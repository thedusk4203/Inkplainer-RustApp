name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache pinned hand sprites
        uses: actions/cache@v4
        with:
          path: ~/.cargo/inkplainer-hand-assets
          key: inkplainer-hand-assets-760af54d3c7e0cf3a846fdf3c7bbe278c9f6df3e
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: inkplainer-cargo-lock
          path: Cargo.lock
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: inkplainer-rustapp-windows
          path: target/release/inkplainer-rustapp.exe
