name: Bootstrap local Rust toolchain

on:
  push:
    branches: [bootstrap-local-rust]
    paths:
      - '.github/workflows/bootstrap-local-rust.yml'

jobs:
  package-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Pack Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          sysroot="$(rustc --print sysroot)"
          parent="$(dirname "$sysroot")"
          name="$(basename "$sysroot")"
          tar -C "$parent" -czf "$RUNNER_TEMP/rust-toolchain-1.99.1-x86_64-unknown-linux-gnu.tar.gz" "$name"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-1.99.1-linux
          path: ${{ runner.temp }}/rust-toolchain-1.99.1-x86_64-unknown-linux-gnu.tar.gz
          compression-level: 0
