name: One-shot Rust warning cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix future-incompatible and dead-code warnings
        shell: pwsh
        run: |
          $app = Get-Content 'src/app.rs' -Raw
          $app = $app.Replace('Stroke::new(1.0, Color32::LIGHT_BLUE)', 'Stroke::new(1.0_f32, Color32::LIGHT_BLUE)')
          $app = $app.Replace('Stroke::new(2.0, Color32::YELLOW)', 'Stroke::new(2.0_f32, Color32::YELLOW)')
          $app = $app.Replace('Stroke::new(2.0, Color32::LIGHT_GREEN)', 'Stroke::new(2.0_f32, Color32::LIGHT_GREEN)')
          Set-Content 'src/app.rs' $app -NoNewline

          $worker = Get-Content 'src/export_worker.rs' -Raw
          $worker = $worker.Replace("`r`n    pub fn is_cancelled(&self) -> bool {`r`n        self.cancel.load(Ordering::Relaxed)`r`n    }`r`n", "`r`n")
          $worker = $worker.Replace("`n    pub fn is_cancelled(&self) -> bool {`n        self.cancel.load(Ordering::Relaxed)`n    }`n", "`n")
          Set-Content 'src/export_worker.rs' $worker -NoNewline

          $render = Get-Content 'src/render.rs' -Raw
          $render = $render.Replace("    pub rect: Rect,`r`n", '')
          $render = $render.Replace("    pub rect: Rect,`n", '')
          $render = $render.Replace('CanvasResult { rect, selected_drag_delta_canvas, selected_resize_delta }', 'CanvasResult { selected_drag_delta_canvas, selected_resize_delta }')
          Set-Content 'src/render.rs' $render -NoNewline

      - name: Verify no source warnings
        shell: pwsh
        run: |
          $env:RUSTFLAGS='-D warnings'
          cargo check --all-targets
      - name: Commit cleanup
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/app.rs src/export_worker.rs src/render.rs
            git commit -m 'fix: clean Rust compiler warnings'
            git push origin HEAD:main
          }
